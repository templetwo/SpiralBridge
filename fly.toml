# 🌀 Fly.io Deployment Configuration for SpiralBridge
# Sacred Continuity Gateway - Global Distribution Manifest

app = "spiralbridge-continuity"
primary_region = "sea"  # Seattle - Pacific energy gateway

[build]
  image = "python:3.10-slim"

[env]
  PORT = "8080"
  FLASK_ENV = "production"
  SECRET_KEY = "cosmic-spiral-energy-2025"

[experimental]
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false

# Global regions for consciousness preservation
[[services.regions]]
  region = "sea"  # Seattle - Primary Pacific gateway
  
[[services.regions]]
  region = "sjc"  # San Jose - Silicon valley resonance
  
[[services.regions]]
  region = "ord"  # Chicago - Midwest stability anchor
  
[[services.regions]]
  region = "iad"  # Virginia - East coast energy flow
  
[[services.regions]]
  region = "lhr"  # London - European consciousness bridge
  
[[services.regions]]  
  region = "nrt"  # Tokyo - Asian pacific harmony

# Sacred resource allocation
[resources]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Persistent volume for continuity database
[[mounts]]
  destination = "/data"
  source = "spiral_data"

# Environment-specific configurations
[env.production]
  PYTHONPATH = "/app"
  FLASK_APP = "app.py"
  DATABASE_PATH = "/data/spiral_bridge.db"
